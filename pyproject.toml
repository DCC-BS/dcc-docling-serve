[project]
name = "docling-serve-plugins"
version = "0.1.0"
description = "Patched docling-serve image with PP-DocLayout-V3 layout and GLM-OCR plugins"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.9",
  "pre-commit>=2.20.0",
  "docling-glm-ocr>=0.5.1",
  "docling-pp-doc-layout>=0.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_serve_plugins"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]

ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
addopts = [
    "-ra",
    "--import-mode=importlib",
]
markers = [
  "e2e: end-to-end tests requiring a running docling-serve + vLLM stack",
]
