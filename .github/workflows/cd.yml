name: Build docling-serve with layout and OCR plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
  workflow_dispatch:
    inputs:
      docling_serve_tag:
        description: "Upstream docling-serve image tag (e.g. latest, v2.3.0)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - suffix: ""
            upstream_image: ghcr.io/docling-project/docling-serve
            platforms: linux/amd64
            cache_scope: base
            default_tag: latest
          - suffix: -cpu
            upstream_image: ghcr.io/docling-project/docling-serve-cpu
            platforms: linux/amd64,linux/arm64
            cache_scope: cpu
            default_tag: latest
          - suffix: -cu128
            upstream_image: ghcr.io/docling-project/docling-serve-cu128
            platforms: linux/amd64
            cache_scope: cu128
            default_tag: main
          - suffix: -cu130
            upstream_image: ghcr.io/docling-project/docling-serve-cu130
            platforms: linux/amd64
            cache_scope: cu130
            default_tag: main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Determine tag
        id: tag
        run: echo "value=${{ inputs.docling_serve_tag || matrix.variant.default_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: plugins
          file: plugins/Dockerfile.docling-serve
          build-args: |
            DOCLING_SERVE_IMAGE=${{ matrix.variant.upstream_image }}
            DOCLING_SERVE_TAG=${{ steps.tag.outputs.value }}
          platforms: ${{ matrix.variant.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant.suffix }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant.suffix }}:latest
          cache-from: type=gha,scope=${{ matrix.variant.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.cache_scope }}
