name: Build docling-serve with layout and OCR plugins

# Images are published only when this workflow is dispatched manually, with the
# upstream docling-serve release to build on. Follow "Upgrading docling-serve" in the
# README before dispatching a new version.
on:
  workflow_dispatch:
    inputs:
      docling_serve_tag:
        description: "Upstream docling-serve tag to build on, tested per the README upgrade checklist (e.g. v1.35.0, or main)"
        required: true
        default: "v1.35.0"
      image_tag:
        description: "Tag to publish our images under (besides latest). Empty: same as the upstream tag"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - suffix: ""
            upstream_image: ghcr.io/docling-project/docling-serve
            platforms: linux/amd64
            cache_scope: base
          - suffix: -cpu
            upstream_image: ghcr.io/docling-project/docling-serve-cpu
            platforms: linux/amd64,linux/arm64
            cache_scope: cpu
          - suffix: -cu128
            upstream_image: ghcr.io/docling-project/docling-serve-cu128
            platforms: linux/amd64
            cache_scope: cu128
          - suffix: -cu130
            upstream_image: ghcr.io/docling-project/docling-serve-cu130
            platforms: linux/amd64
            cache_scope: cu130
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Determine tags
        id: tag
        env:
          UPSTREAM_TAG: ${{ inputs.docling_serve_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "upstream=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_TAG:-$UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

      # Pin the upstream image by digest: tags like `main` move, the digest records exactly
      # what this build is based on (image label + run summary).
      - name: Resolve upstream image
        id: upstream
        env:
          UPSTREAM_REF: ${{ matrix.variant.upstream_image }}:${{ steps.tag.outputs.upstream }}
        run: |
          digest="$(docker buildx imagetools inspect "$UPSTREAM_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- \`$UPSTREAM_REF\` → \`$digest\` published as \`${{ steps.tag.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: plugins
          file: plugins/Dockerfile.docling-serve
          build-args: |
            DOCLING_SERVE_IMAGE=${{ matrix.variant.upstream_image }}
            DOCLING_SERVE_TAG=${{ steps.tag.outputs.upstream }}@${{ steps.upstream.outputs.digest }}
          platforms: ${{ matrix.variant.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant.suffix }}:${{ steps.tag.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant.suffix }}:latest
          labels: |
            org.opencontainers.image.base.name=${{ matrix.variant.upstream_image }}:${{ steps.tag.outputs.upstream }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.digest }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.cache_scope }}
