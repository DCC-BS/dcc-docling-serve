name: Build docling-serve with layout and OCR plugins

# Images are published only when this workflow is dispatched manually with a docling-serve
# release tag. Our images get the same tag: dcc-docling-serve:v1.36.0 is docling-serve v1.36.0
# with our plugins and patches. Follow "Upgrading docling-serve" in the README first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "docling-serve release tag to build on and publish under (e.g. v1.36.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - suffix: ""
            upstream_image: ghcr.io/docling-project/docling-serve
            platforms: linux/amd64
            cache_scope: base
          - suffix: -cpu
            upstream_image: ghcr.io/docling-project/docling-serve-cpu
            platforms: linux/amd64,linux/arm64
            cache_scope: cpu
          - suffix: -cu128
            upstream_image: ghcr.io/docling-project/docling-serve-cu128
            platforms: linux/amd64
            cache_scope: cu128
          - suffix: -cu130
            upstream_image: ghcr.io/docling-project/docling-serve-cu130
            platforms: linux/amd64
            cache_scope: cu130
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Release tags only: moving tags like main or latest would publish unreleased code
      # under a version number.
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::version must be a docling-serve release tag like v1.36.0, got '$VERSION'"; exit 1; }

      # Pin the upstream image by digest: the variants of one run share the same base, and the
      # digest records exactly what this build is based on (image label + run summary).
      - name: Resolve upstream image
        id: upstream
        env:
          UPSTREAM_REF: ${{ matrix.variant.upstream_image }}:${{ inputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "$UPSTREAM_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- \`$UPSTREAM_REF\` → \`$digest\` published as \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: plugins
          file: plugins/Dockerfile.docling-serve
          build-args: |
            DOCLING_SERVE_IMAGE=${{ matrix.variant.upstream_image }}
            DOCLING_SERVE_TAG=${{ inputs.version }}@${{ steps.upstream.outputs.digest }}
          platforms: ${{ matrix.variant.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant.suffix }}:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant.suffix }}:latest
          labels: |
            org.opencontainers.image.base.name=${{ matrix.variant.upstream_image }}:${{ inputs.version }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.digest }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.cache_scope }}
