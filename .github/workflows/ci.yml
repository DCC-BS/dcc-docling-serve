name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install latest docling and plugin packages
        run: uv pip install docling docling-core docling-glm-ocr docling-pp-doc-layout

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Test document conversion execution with plugins
        run: |
          uv run python -c '
          from unittest.mock import patch
          import httpx
          from docling.datamodel.base_models import InputFormat
          from docling.datamodel.pipeline_options import PdfPipelineOptions
          from docling.document_converter import DocumentConverter, ImageFormatOption
          from docling_glm_ocr import GlmOcrRemoteOptions
          from docling_glm_ocr.model import GlmOcrRemoteModel
          from docling_pp_doc_layout.options import PPDocLayoutV3Options

          def mock_handler(request: httpx.Request) -> httpx.Response:
              return httpx.Response(200, json={"choices": [{"message": {"content": "Sample OCR text"}}]}, request=request)

          mock_client = httpx.Client(transport=httpx.MockTransport(mock_handler))

          opts = PdfPipelineOptions(
              allow_external_plugins=True,
              do_ocr=True,
              force_full_page_ocr=True,
              ocr_options=GlmOcrRemoteOptions(api_url="http://localhost:8001/v1/chat/completions"),
              layout_options=PPDocLayoutV3Options(),
          )
          conv = DocumentConverter(format_options={InputFormat.IMAGE: ImageFormatOption(pipeline_options=opts)})

          with patch.object(GlmOcrRemoteModel, "_get_client", return_value=mock_client):
              result = conv.convert("data/ocr.png")
              md = result.document.export_to_markdown()
              assert len(md.strip()) > 0, "Expected non-empty markdown output"
          '

  # Required by the main branch ruleset: proves the plugin image still builds. No push; the
  # published images come from cd.yml (manual dispatch with a docling-serve release tag).
  build:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=docling-project/docling-serve
      DOCLING_SERVE_VERSION: v1.38.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The CPU variant is the smallest; the plugin layers are the same for every variant.
      - name: Build plugin image (CPU variant)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: plugins
          file: plugins/Dockerfile.docling-serve
          build-args: |
            DOCLING_SERVE_IMAGE=ghcr.io/docling-project/docling-serve-cpu
            DOCLING_SERVE_TAG=${{ env.DOCLING_SERVE_VERSION }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=cpu
