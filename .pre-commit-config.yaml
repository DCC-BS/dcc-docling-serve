repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json|.vscode/.*
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json|.vscode/.*
        args: [--autofix]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.9.9"
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
        types_or: [ python, pyi ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: local
    hooks:
      # benchmarks/internal holds private documents; .gitignore keeps them out, this catches `git add -f`
      - id: no-internal-benchmark-data
        name: no private benchmark data
        entry: private benchmark data must not be committed (benchmarks/internal/ is local only)
        language: fail
        files: ^benchmarks/internal/
        exclude: ^benchmarks/internal/README\.md$
