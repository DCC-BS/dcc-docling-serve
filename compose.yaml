services:
  # ── vLLM serving GLM-OCR ──────────────────────────────────────────────
  vllm-glm-ocr:
    image: vllm/vllm-openai:v0.27.1
    ipc: host
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "${VLLM_HOST_PORT:-8001}:8000"
    volumes:
      - ${HF_CACHE_DIR:-.hf-cache}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      LD_LIBRARY_PATH: /lib/x86_64-linux-gnu
    command:
      - --model
      - zai-org/GLM-OCR
      - --served-model-name
      - zai-org/GLM-OCR
      - --port
      - "8000"
      - --trust-remote-code
      - --max-num-batched-tokens
      - "8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # ── Docling API server with UI ────────────────────────────────────────
  docling-serve:
    build:
      context: plugins
      dockerfile: Dockerfile.docling-serve
      pull: true
    image: ${DOCLING_IMAGE:-ghcr.io/dcc-bs/dcc-docling-serve:latest}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "${DOCLING_HOST_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "true"
      DOCLING_SERVE_ALLOW_CUSTOM_LAYOUT_CONFIG: "true"
      DOCLING_SERVE_LOG_LEVEL: "${DOCLING_SERVE_LOG_LEVEL:-INFO}"
      GLMOCR_REMOTE_OCR_API_URL: http://vllm-glm-ocr:8000/v1/chat/completions
    depends_on:
      vllm-glm-ocr:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped
